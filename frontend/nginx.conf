server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container.
    # The trailing slash on proxy_pass strips the /api prefix, so
    # /api/auth/login here becomes /auth/login on the backend.
    # Because the browser only ever talks to this origin, there are no
    # cross-origin requests and CORS never comes into play.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router handles routing in the browser, so any path that isn't a
    # real file must still return index.html. Without this, refreshing on
    # /inventory would 404 — nginx would look for a file by that name.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
