# nginx.conf — outline only, no implementation yet.
#
# This gets copied into the frontend image (stage 2 of the Dockerfile) to
# replace nginx's default config. Without it, nginx serves your built
# React app fine at "/", but 404s on a hard refresh of any other route
# (e.g. /inventory) — because nginx looks for an actual file at that
# path, and there isn't one; React Router only knows how to handle that
# route once index.html and your JS have already loaded in the browser.
#
# What this needs, roughly:
#   1. a server block listening on port 80
#   2. a root pointing at wherever the built static files were copied to
#      in the Dockerfile (commonly /usr/share/nginx/html)
#   3. a location / block using try_files to fall back to index.html for
#      any path that doesn't match a real file — this is the actual fix
#      for the refresh-404 problem above
#
# Look up: nginx's try_files directive, and "nginx spa fallback" or
# "nginx try_files react router" for the standard pattern — this is a
# well-worn problem, not something to solve from scratch.
#
# Worth checking once this exists: does the "root" path here actually
# match where the Dockerfile's COPY --from= step puts the build output?
# A mismatch between the two is a common way this silently serves
# nothing at all.
