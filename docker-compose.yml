# docker-compose.yml — outline only, no implementation yet.

# frontend:
#   - builds from frontend/Dockerfile
#   - maps port 80 (or wherever nginx serves) to a host port
#   - depends_on: backend

# Also needed: a top-level volumes: entry for postgres's named volume,
# and (optional but common) a shared network so service-name-based
# hostname resolution definitely works between containers.

services:
  postgres:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8180:80"
    depends_on:
      - backend

volumes:
  postgres_data:
